name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check --settings=ReviveCare.test_settings
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=ReviveCare.test_settings
      - name: Tests
        run: python manage.py test --settings=ReviveCare.test_settings
      - name: Rep counting tests (recorded pose landmarks)
        run: node --test static/js/reps.test.js
      - name: Compiled Tailwind CSS is up to date
        run: |
          curl -sSL -o /tmp/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.18/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i static/css/input.css -o static/css/app.css --minify
          git diff --exit-code static/css/app.css

  smoke:
    # Click through the app in headless Chrome against a seeded SQLite database (see Backend/tests/smoke.mjs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      DATABASE_URL: sqlite:///smoke.sqlite3
      DEBUG: 'True'
      COOKIE_SECURE: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - name: Start the dev server
        run: |
          python manage.py runserver 127.0.0.1:8000 --noreload > server.log 2>&1 &
          for i in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8000/ && exit 0; sleep 1; done
          cat server.log; exit 1
      - name: Smoke test
        run: node tests/smoke.mjs
        env:
          CHROME: google-chrome
      - name: Server log
        if: failure()
        run: cat server.log
