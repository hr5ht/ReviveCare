name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check --settings=ReviveCare.test_settings
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=ReviveCare.test_settings
      - name: Tests
        run: python manage.py test --settings=ReviveCare.test_settings
      - name: Compiled Tailwind CSS is up to date
        run: |
          curl -sSL -o /tmp/tailwindcss https://github.com/tailwindlabs/tailwindcss/releases/download/v4.1.18/tailwindcss-linux-x64
          chmod +x /tmp/tailwindcss
          /tmp/tailwindcss -i static/css/input.css -o static/css/app.css --minify
          git diff --exit-code static/css/app.css
