{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ReviveCare{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <link rel="apple-touch-icon" href="{% static 'icons/apple-touch-icon.png' %}">
  <meta name="theme-color" content="#10b981">
  <script>
    // Light/dark: the choice saved by the toggle, else the system setting. Runs before the stylesheet so pages don't flash.
    const systemDark = matchMedia('(prefers-color-scheme: dark)');
    const savedTheme = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
    const applyTheme = () => document.documentElement.dataset.theme = savedTheme() || (systemDark.matches ? 'dark' : 'light');
    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', next); } catch {}
      document.documentElement.dataset.theme = next;
    }
    applyTheme();
    systemDark.addEventListener('change', applyTheme);
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/lucide.min.js' %}"></script>  <!-- lucide 0.563.0 -->
  {% block head %}{% endblock %}
</head>

<body>
  {% block body %}{% endblock %}

  <!-- Shown by the browser's install event (Chrome, Edge, Android); hidden once installed or dismissed -->
  <div id="install-banner" hidden role="region" aria-label="Install app" class="fixed bottom-4 inset-x-4 sm:left-auto sm:right-4 sm:w-96 z-50 bg-white border border-slate-200 rounded-2xl shadow-xl p-4 flex items-center gap-3">
    <img src="{% static 'icons/icon-192.png' %}" alt="" width="40" height="40" class="rounded-xl flex-shrink-0">
    <p class="flex-1 text-sm text-slate-700"><span class="block font-semibold text-slate-900">Install ReViveCare</span>Open it from your home screen like an app.</p>
    <button type="button" id="install-btn" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold">Install</button>
    <button type="button" id="install-close" aria-label="Not now" class="p-1.5 text-slate-400 hover:text-slate-700 rounded-lg"><i data-lucide="x" class="w-4 h-4"></i></button>
  </div>

  <script>
    // JSON helper for the Django API (same origin, session cookie auth)
    async function api(url, method = 'GET', data = null) {
      const res = await fetch(url, {
        method,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: data && method !== 'GET' ? JSON.stringify(data) : null,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || json.message || `API Error: ${res.statusText}`);
      return json;
    }
    async function patientLogout() {
      await api('/api/patient/logout/', 'POST').catch(() => {});
      location.href = '/patient/login/';
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
    (() => {
      const banner = document.getElementById('install-banner');
      let installEvent = null;
      const dismissed = () => { try { return localStorage.getItem('install-dismissed'); } catch { return '1'; } };
      addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();  // show our banner instead of the browser's mini-infobar
        installEvent = e;
        if (!dismissed()) banner.hidden = false;
      });
      document.getElementById('install-btn').onclick = async () => {
        banner.hidden = true;
        installEvent?.prompt();
        installEvent = null;
      };
      document.getElementById('install-close').onclick = () => {
        banner.hidden = true;
        try { localStorage.setItem('install-dismissed', '1'); } catch {}
      };
      addEventListener('appinstalled', () => { banner.hidden = true; });
    })();
    const icons = () => lucide.createIcons();
    icons();
  </script>
  {% block scripts %}{% endblock %}
</body>

</html>
