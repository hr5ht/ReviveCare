{% load static %}
<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}ReviveCare{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
  <script>
    // Light/dark: the choice saved by the toggle, else the system setting. Runs before the stylesheet so pages don't flash.
    const systemDark = matchMedia('(prefers-color-scheme: dark)');
    const savedTheme = () => { try { return localStorage.getItem('theme'); } catch { return null; } };
    const applyTheme = () => document.documentElement.dataset.theme = savedTheme() || (systemDark.matches ? 'dark' : 'light');
    function toggleTheme() {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem('theme', next); } catch {}
      document.documentElement.dataset.theme = next;
    }
    applyTheme();
    systemDark.addEventListener('change', applyTheme);
  </script>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/lucide.min.js' %}"></script>  <!-- lucide 0.563.0 -->
  {% block head %}{% endblock %}
</head>

<body>
  {% block body %}{% endblock %}

  <script>
    // JSON helper for the Django API (same origin, session cookie auth)
    async function api(url, method = 'GET', data = null) {
      const res = await fetch(url, {
        method,
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json', 'X-CSRFToken': '{{ csrf_token }}' },
        body: data && method !== 'GET' ? JSON.stringify(data) : null,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || json.message || `API Error: ${res.statusText}`);
      return json;
    }
    async function patientLogout() {
      await api('/api/patient/logout/', 'POST').catch(() => {});
      location.href = '/patient/login/';
    }
    const icons = () => lucide.createIcons();
    icons();
  </script>
  {% block scripts %}{% endblock %}
</body>

</html>
