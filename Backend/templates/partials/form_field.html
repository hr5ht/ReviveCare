<div class="mb-5 {{ cls }}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-start gap-3 text-sm text-slate-700 cursor-pointer">
        <input type="checkbox" name="{{ field.html_name }}" id="{{ field.id_for_label }}" {% if field.value %}checked{% endif %} class="mt-0.5 w-4 h-4 accent-emerald-600" />
        {{ field.label }}
    </label>
    {% else %}
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700 mb-2">{{ field.label }}{% if field.field.required %}<span class="text-rose-500 ml-1">*</span>{% endif %}</label>
    <input id="{{ field.id_for_label }}" name="{{ field.html_name }}" {% if field.field.required %}required{% endif %}
        type="{% if field.name == 'email' %}email{% elif field.field.widget.input_type == 'password' %}password{% else %}text{% endif %}"
        {% if field.field.widget.input_type == 'password' %}autocomplete="{% if field.name == 'setup_code' %}off{% else %}new-password{% endif %}"{% else %}value="{{ field.value|default:'' }}"{% endif %}
        {% if field.name == 'email' %}autocomplete="email"{% endif %}
        class="w-full px-4 py-3 bg-white border {% if field.errors %}border-rose-300 focus:border-rose-500 focus:ring-rose-500/20{% else %}border-slate-200 focus:border-emerald-400 focus:ring-emerald-500/20{% endif %} rounded-xl text-slate-800 placeholder:text-slate-400 focus:outline-none focus:ring-4 transition-all" />
    {% if field.help_text %}<p class="mt-1.5 text-xs text-slate-500">{{ field.help_text }}</p>{% endif %}
    {% endif %}
    {% for error in field.errors %}<p class="mt-1.5 text-sm text-rose-600">{{ error }}</p>{% endfor %}
</div>
