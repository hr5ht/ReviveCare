<nav class="bg-gradient-to-r from-emerald-500 to-emerald-600 shadow-lg shadow-emerald-500/20">
    <div class="max-w-7xl mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo - goes Home -->
            <button onclick="location.href='/'" class="flex items-center gap-3 hover:opacity-80 transition-opacity cursor-pointer">
                <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center">
                    <i data-lucide="heart" class="w-6 h-6 text-white" fill="white"></i>
                </div>
                <span class="text-2xl font-bold text-white tracking-tight">ReViveCare</span>
            </button>

            <!-- Doctor Profile -->
            <div class="flex items-center gap-4">
                <button class="relative p-2 hover:bg-white/10 rounded-lg transition-colors">
                    <i data-lucide="bell" class="w-5 h-5 text-white"></i>
                    <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-current"></span>
                </button>

                <a href="/doctor/profile/" title="Profile settings" class="flex items-center gap-3 bg-white/10 hover:bg-white/20 backdrop-blur-sm rounded-xl px-4 py-2 transition-colors">
                    <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-emerald-600 font-semibold">{{ doctor_initials }}</div>
                    <div class="text-left">
                        <p class="text-white font-semibold text-sm">{{ doctor_name }}</p>
                        <p class="text-emerald-100 text-xs">{{ doctor_specialty }}</p>
                    </div>
                </a>

                <form method="post" action="/doctor/logout/">
                    {% csrf_token %}
                    <button type="submit" title="Log out" class="p-2 hover:bg-white/10 rounded-lg transition-colors">
                        <i data-lucide="log-out" class="w-5 h-5 text-white"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>
