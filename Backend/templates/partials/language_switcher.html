{% load i18n %}{% get_current_language as current %}{% get_available_languages as languages %}
<form action="/i18n/setlang/" method="post" class="flex items-center">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="language-select" class="sr-only">{% translate "Language" %}</label>
    <select id="language-select" name="language" onchange="this.form.submit()" class="py-2 pl-2 pr-7 text-sm font-medium text-slate-600 bg-transparent hover:bg-slate-100 rounded-xl border-0 cursor-pointer">
        {% for code, name in languages %}<option value="{{ code }}" lang="{{ code }}" {% if code == current %}selected{% endif %}>{{ name }}</option>{% endfor %}
    </select>
    <noscript><button type="submit" class="ml-1 text-sm font-semibold text-emerald-700">{% translate "Go" %}</button></noscript>
</form>
