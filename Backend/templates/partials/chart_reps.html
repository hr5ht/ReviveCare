            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                <h2 class="font-semibold text-slate-900">Reps per day</h2>
                <p class="text-sm text-slate-500 mb-4">{{ reps_total }} reps in the last {{ days }} days</p>
                <div id="reps-chart" class="h-[220px]"></div>
                <details class="mt-3 text-sm text-slate-600">
                    <summary class="cursor-pointer text-slate-500 hover:text-slate-700">Show as table</summary>
                    <table class="mt-2 w-full tabular-nums"><tbody>
                        {% for d in reps_chart %}{% if d.value %}<tr><td class="py-1">{{ d.label }}</td><td class="py-1 text-right">{{ d.value }}</td></tr>{% endif %}{% endfor %}
                    </tbody></table>
                </details>
            </section>
