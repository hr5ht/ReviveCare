{% extends "base.html" %}

{% block body %}

        <div class="max-w-3xl mx-auto px-6 py-4">
            <a href="/" class="inline-flex items-center gap-3 hover:opacity-80 transition-opacity">
                <span class="w-10 h-10 bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-xl flex items-center justify-center shadow-sm"><i data-lucide="heart" class="w-6 h-6 text-white" fill="white"></i></span>
